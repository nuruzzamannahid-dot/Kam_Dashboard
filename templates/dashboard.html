<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEAM GRID ISSUES ESCALATION DASHBOARD </title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f0f2f8;--bg2:#e8eaf2;--card:#ffffff;--border:#dde1f0;
  --nb:#0066ff;--ng:#00b87a;--np:#ff0055;--npu:#8800ff;--ny:#ffaa00;--nc:#00ccdd;
  --text:#1a1a2e;--tdim:#7a80a0;--tbright:#0a0a1a;
  --gb:0 0 14px #0066ff55,0 0 28px #0066ff22;
  --gg:0 0 14px #00b87a55,0 0 28px #00b87a22;
  --gp:0 0 14px #ff005555,0 0 28px #ff005522;
  --gpu:0 0 14px #8800ff55,0 0 28px #8800ff22;
  --gy:0 0 14px #ffaa0055,0 0 28px #ffaa0022;
  --gc:0 0 14px #00ccdd55,0 0 28px #00ccdd22;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 10% 10%,#0066ff08,transparent),radial-gradient(ellipse 50% 40% at 90% 80%,#8800ff08,transparent);pointer-events:none;z-index:0}

.topbar{background:rgba(255,255,255,0.93);border-bottom:2px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);box-shadow:0 2px 24px #0066ff12}
.logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--nb);text-shadow:var(--gb);letter-spacing:.05em}
.logo span{color:var(--tdim);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:12px}
.pip{width:9px;height:9px;border-radius:50%;background:#ccc;display:inline-block;margin-right:5px;transition:all .3s}
.pip.on{background:var(--ng);box-shadow:var(--gg);animation:pulse 2s infinite}
.pip.warn{background:var(--ny);box-shadow:var(--gy)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.upd{font-size:11px;color:var(--tdim);font-family:'Space Mono',monospace}
.rbtn{font-size:11px;padding:7px 18px;border-radius:6px;border:2px solid var(--nb);background:transparent;cursor:pointer;color:var(--nb);font-family:'Space Mono',monospace;font-weight:700;transition:all .2s;box-shadow:var(--gb)}
.rbtn:hover{background:var(--nb);color:#fff;box-shadow:0 0 24px #0066ff66}

.wrap{max-width:1240px;margin:0 auto;padding:28px 20px;position:relative;z-index:1}

.shdr{display:flex;align-items:center;gap:12px;margin:32px 0 16px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.shdr::after{content:'';flex:1;height:2px;border-radius:1px}
.shdr.issue .shdr-txt{color:var(--nb);text-shadow:var(--gb)}
.shdr.issue::after{background:linear-gradient(90deg,var(--nb)55,transparent)}
.shdr.mail .shdr-txt{color:var(--npu);text-shadow:var(--gpu)}
.shdr.mail::after{background:linear-gradient(90deg,var(--npu)55,transparent)}
.shdr.log .shdr-txt{color:var(--ng);text-shadow:var(--gg)}
.shdr.log::after{background:linear-gradient(90deg,var(--ng)55,transparent)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 18px 14px;position:relative;overflow:hidden;transition:all .3s;box-shadow:0 2px 14px #00000008}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.mc.nb::before{background:var(--nb);box-shadow:0 0 14px var(--nb)}
.mc.ng::before{background:var(--ng);box-shadow:0 0 14px var(--ng)}
.mc.np::before{background:var(--np);box-shadow:0 0 14px var(--np)}
.mc.ny::before{background:var(--ny);box-shadow:0 0 14px var(--ny)}
.mc.npu::before{background:var(--npu);box-shadow:0 0 14px var(--npu)}
.mc.nc::before{background:var(--nc);box-shadow:0 0 14px var(--nc)}
.mc:hover{transform:translateY(-3px);box-shadow:0 8px 28px #00000012}
.mc-lbl{font-size:10px;color:var(--tdim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-family:'Space Mono',monospace}
.mc-val{font-size:30px;font-weight:700;font-family:'Space Mono',monospace}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:20px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;overflow:hidden;transition:all .3s;box-shadow:0 2px 14px #00000008}
.kcard:hover{transform:translateY(-3px);box-shadow:0 8px 28px #00000012}
.kcard.asif{border-top:3px solid var(--nb);box-shadow:0 2px 14px #0066ff10}
.kcard.nahid{border-top:3px solid var(--ng);box-shadow:0 2px 14px #00b87a10}
.kcard.vacant{opacity:.25;border-style:dashed;pointer-events:none}
.kglow{position:absolute;top:-60px;right:-60px;width:140px;height:140px;border-radius:50%;filter:blur(50px);pointer-events:none;opacity:.15}
.kcard.asif .kglow{background:var(--nb)}
.kcard.nahid .kglow{background:var(--ng)}
.khdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'Space Mono',monospace;flex-shrink:0;border:2px solid}
.av.a{background:#e6f0ff;color:var(--nb);border-color:var(--nb);box-shadow:var(--gb)}
.av.n{background:#e0f7f0;color:var(--ng);border-color:var(--ng);box-shadow:var(--gg)}
.av.v{background:#f0f0f5;color:#ccc;border-color:#ddd}
.kname{font-size:15px;font-weight:700;color:var(--tbright)}
.krole{font-size:10px;color:var(--tdim);text-transform:uppercase;letter-spacing:.1em;font-family:'Space Mono',monospace}
.rbadge{font-size:11px;padding:4px 10px;border-radius:4px;margin-left:auto;font-family:'Space Mono',monospace;font-weight:700;border:1.5px solid}
.rbg{background:#e0f7f0;color:var(--ng);border-color:var(--ng);box-shadow:var(--gg)}
.rbm{background:#fff8e0;color:var(--ny);border-color:var(--ny);box-shadow:var(--gy)}
.rbb{background:#ffe0ea;color:var(--np);border-color:var(--np);box-shadow:var(--gp)}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ms{text-align:center;padding:10px 4px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.ms-v{font-size:19px;font-weight:700;font-family:'Space Mono',monospace}
.ms-l{font-size:9px;color:var(--tdim);text-transform:uppercase;letter-spacing:.05em}
.ms.t .ms-v{color:var(--nb)}
.ms.s .ms-v{color:var(--ng)}
.ms.p .ms-v{color:var(--ny)}
.ms.i .ms-v{color:var(--npu)}
.rb-bg{background:var(--bg2);border-radius:3px;height:5px;margin:4px 0 12px}
.rb{height:5px;border-radius:3px;transition:width .6s}
.rbcg{background:linear-gradient(90deg,var(--ng),#00e69988);box-shadow:0 0 8px var(--ng)}
.rbcm{background:linear-gradient(90deg,var(--ny),#ffcc4488);box-shadow:0 0 8px var(--ny)}
.rbcb{background:linear-gradient(90deg,var(--np),#ff448888);box-shadow:0 0 8px var(--np)}
.clbl{font-size:10px;color:var(--tdim);text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;margin-bottom:6px}
.cpill{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--tdim)}
.tcats{display:flex;flex-wrap:wrap;gap:4px}
.ua{font-size:11px;color:var(--ny);background:#fff8e0;border:1.5px solid var(--ny);padding:5px 10px;border-radius:5px;margin-top:10px;font-family:'Space Mono',monospace;box-shadow:var(--gy)}

.cc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 2px 14px #00000008}
.chdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ctitle{font-size:11px;font-weight:700;color:var(--tdim);text-transform:uppercase;letter-spacing:.12em;font-family:'Space Mono',monospace}
.tgg{display:flex;gap:4px}
.tg{font-size:10px;padding:5px 12px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg);color:var(--tdim);cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;transition:all .2s}
.tg.on{background:#e6f0ff;color:var(--nb);border-color:var(--nb);box-shadow:var(--gb)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tdim);font-family:'Space Mono',monospace}
.ld{width:9px;height:9px;border-radius:2px}
.tbadge{background:#e0f7f0;color:var(--ng);border:1.5px solid var(--ng);font-size:10px;padding:2px 10px;border-radius:4px;font-family:'Space Mono',monospace;margin-left:8px;font-weight:700;box-shadow:var(--gg)}

.fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.fbcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;border-left:4px solid var(--npu);box-shadow:0 2px 14px #8800ff08}
.fbname{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--tbright)}
.fbstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fbst{text-align:center;padding:10px 4px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.fbst-v{font-size:20px;font-weight:700;font-family:'Space Mono',monospace}
.fbst-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--tdim)}
.fbt .fbst-v{color:var(--npu)}.fbp .fbst-v{color:var(--ny)}.fbs .fbst-v{color:var(--ng)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{font-size:12px;padding:8px 12px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;transition:all .2s}
.filters input:focus,.filters select:focus{border-color:var(--nb);outline:none;box-shadow:var(--gb)}
.filters input{flex:1;min-width:160px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-size:11px;padding:6px 14px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--tdim);cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;transition:all .2s}
.tab.on{background:#e0f7f0;color:var(--ng);border-color:var(--ng);box-shadow:var(--gg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--tdim);font-weight:700;font-size:10px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f5f7ff}
.pill{font-size:10px;padding:2px 9px;border-radius:4px;display:inline-block;font-family:'Space Mono',monospace;font-weight:700;border:1.5px solid}
.ps{background:#e0f7f0;color:var(--ng);border-color:var(--ng);box-shadow:var(--gg)}
.po{background:var(--bg);color:var(--tdim);border-color:var(--border)}
.pir{background:#f0e0ff;color:var(--npu);border-color:var(--npu);box-shadow:var(--gpu)}
.pu{background:#ffe0ea;color:var(--np);border-color:var(--np);box-shadow:var(--gp)}
.ppd{background:#fff8e0;color:var(--ny);border-color:var(--ny);box-shadow:var(--gy)}
.psv{background:#e0f7f0;color:var(--ng);border-color:var(--ng);box-shadow:var(--gg)}
.tc{font-size:10px;color:var(--tdim);text-align:right;margin-top:8px;font-family:'Space Mono',monospace}
.err{background:#ffe0ea;border:1.5px solid var(--np);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--np);margin-bottom:14px;font-family:'Space Mono',monospace}
.spin{text-align:center;padding:60px;color:var(--tdim);font-size:13px;font-family:'Space Mono',monospace}
.spin::after{content:'';display:block;margin:16px auto 0;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--nb);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){.cgrid,.fbgrid{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="logo">KAM<span>_</span>DASHBOARD</div>
    <div class="upd" id="upd">— connecting —</div>
  </div>
  <div class="topbar-right">
    <span style="font-size:11px;color:var(--tdim);font-family:'Space Mono',monospace">
      <span class="pip" id="dot"></span><span id="ltxt">init</span>
    </span>
    <button class="rbtn" onclick="load()">↻ REFRESH</button>
  </div>
</div>

<div class="wrap">
  <div id="err" style="display:none" class="err"></div>
  <div id="spin" class="spin">Loading live data</div>
  <div id="app" style="display:none">

    <div class="shdr issue"><span>📋</span><span class="shdr-txt">Issue Tracker</span></div>
    <div class="mgrid" id="mrow"></div>
    <div class="cgrid" id="cards"></div>

    <div class="cc">
      <div class="chdr"><div class="ctitle">Issues by category</div></div>
      <div class="legend" id="cleg"></div>
      <div style="position:relative;height:240px"><canvas id="cChart"></canvas></div>
    </div>

    <div class="cc">
      <div class="chdr">
        <div class="ctitle">Daily issues — last <span id="dlbl">7</span>d <span class="tbadge" id="tbadge">Today: 0</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="tgg">
            <button class="tg on" id="t7" onclick="setDR(7)">7D</button>
            <button class="tg" id="t30" onclick="setDR(30)">30D</button>
          </div>
          <div class="tgg">
            <button class="tg on" id="tda" onclick="setDV('all')">ALL</button>
            <button class="tg" id="tdp" onclick="setDV('per')">PER MEMBER</button>
          </div>
        </div>
      </div>
      <div class="legend" id="dleg"></div>
      <div style="position:relative;height:240px"><canvas id="dChart"></canvas></div>
    </div>

    <div class="cc">
      <div class="chdr">
        <div class="ctitle">Monthly issues</div>
        <div class="tgg">
          <button class="tg on" id="tma" onclick="setMV('all')">ALL</button>
          <button class="tg" id="tmp" onclick="setMV('per')">PER MEMBER</button>
        </div>
      </div>
      <div class="legend" id="mleg"></div>
      <div style="position:relative;height:240px"><canvas id="mChart"></canvas></div>
    </div>

    <div class="shdr mail"><span>✉️</span><span class="shdr-txt">Mail Feedback Tracker</span></div>
    <div class="mgrid" id="fbrow"></div>
    <div class="fbgrid" id="fbpm"></div>
    <div class="cc">
      <div class="chdr"><div class="ctitle">Mail log</div></div>
      <div class="filters">
        <input type="text" id="fbs" placeholder="Search mail subject…">
        <select id="fbst"><option value="all">All mails</option><option value="pending">Pending only</option><option value="solved">Solved only</option></select>
        <select id="fbm"><option value="all">All members</option><option value="asif">Ahmed Asif Rashid</option><option value="nahid">Nuruzzaman Nahid</option></select>
      </div>
      <div class="tw" id="fbtbl"></div>
    </div>

    <div class="shdr log"><span>📁</span><span class="shdr-txt">Issues Log</span></div>
    <div class="cc">
      <div class="filters">
        <input type="text" id="sq" placeholder="Search consignment, comment, category…">
        <select id="df"><option value="">All dates</option></select>
        <select id="cf"><option value="">All categories</option></select>
      </div>
      <div class="tabs">
        <button class="tab on" data-t="all">All</button>
        <button class="tab" data-t="asif">Ahmed Asif Rashid</button>
        <button class="tab" data-t="nahid">Nuruzzaman Nahid</button>
        <button class="tab" data-t="ir">IR mails only</button>
      </div>
      <div class="tw" id="itbl"></div>
    </div>

  </div>
</div>

<script>
const MC={asif:'#0066ff',nahid:'#00b87a'};
const MN={asif:'Ahmed Asif Rashid',nahid:'Nuruzzaman Nahid'};
const AV={asif:'a',nahid:'n',vacant:'v'};
const CLR=['#0066ff','#00b87a','#ff0055','#8800ff','#ffaa00','#00ccdd','#ff5500','#cc44ff'];
Chart.defaults.color='#7a80a0';Chart.defaults.borderColor='#dde1f0';
Chart.defaults.font.family='Space Mono';Chart.defaults.font.size=10;
let ALL=[],FB=[],CC=null,DC=null,MC2=null,TAB='all',DR=7,DV='all',MV='all',DD=[],MD=[],AK=[];

function load(){
  sl('warn','refreshing…');
  fetch('/api/data').then(r=>r.json()).then(d=>{
    document.getElementById('spin').style.display='none';
    document.getElementById('app').style.display='block';
    if(!d.ok)se('Sheet error: '+d.error);
    else document.getElementById('err').style.display='none';
    ALL=d.rows;DD=d.daily_trend||[];MD=d.monthly_trend||[];
    if(DD.length)AK=Object.keys(DD[0].per_member||{});
    rMetrics(d.summary);rCards(d.members);rCat(d.cat_chart);rDay();rMon();rFilt(d.dates,d.cats);rIss();
    const fb=d.feedback||{};FB=fb.rows||[];rFbM(fb);rFbPM(fb.per_member||{});rFbT();
    sl('on','live');document.getElementById('upd').textContent='updated '+new Date().toLocaleTimeString()+' · auto-refresh 90s';
  }).catch(e=>{sl('warn','error');se('Failed: '+e.message);document.getElementById('spin').style.display='none';});
}
function sl(c,t){document.getElementById('dot').className='pip '+c;document.getElementById('ltxt').textContent=t;}
function se(m){const b=document.getElementById('err');b.style.display='block';b.textContent='⚠ '+m;}

function rMetrics(s){
  const rc=s.ratio>=80?'var(--ng)':s.ratio>=50?'var(--ny)':'var(--np)';
  document.getElementById('mrow').innerHTML=`
    <div class="mc nb"><div class="mc-lbl">Total Issues</div><div class="mc-val" style="color:var(--nb)">${s.total}</div></div>
    <div class="mc ng"><div class="mc-lbl">Solved</div><div class="mc-val" style="color:var(--ng)">${s.solved}</div></div>
    <div class="mc ny"><div class="mc-lbl">Solve Ratio</div><div class="mc-val" style="color:${rc}">${s.ratio}%</div></div>
    <div class="mc npu"><div class="mc-lbl">IR Mails</div><div class="mc-val" style="color:var(--npu)">${s.ir}</div></div>
    <div class="mc np"><div class="mc-lbl">Urgent</div><div class="mc-val" style="color:var(--np)">${s.urgent}</div></div>`;
}

function rCards(members){
  let h='';
  members.forEach(m=>{
    if(m.vacant){h+=`<div class="kcard vacant"><div class="khdr"><div class="av v">?</div><div><div class="kname" style="color:#aaa">Seat Vacant</div><div class="krole">hire pending</div></div></div></div>`;return;}
    const rc=m.ratio>=80?'rbg':m.ratio>=50?'rbm':'rbb';
    const bc=m.ratio>=80?'rbcg':m.ratio>=50?'rbcm':'rbcb';
    const tc=(m.top_cats||[]).map(([c,n])=>`<span class="cpill">${c} (${n})</span>`).join('');
    const ua=m.urgent>0?`<div class="ua">⚡ ${m.urgent} urgent issue${m.urgent>1?'s':''}</div>`:'';
    h+=`<div class="kcard ${m.key}"><div class="kglow"></div>
      <div class="khdr">
        <div class="av ${AV[m.key]||'v'}">${m.initials}</div>
        <div style="flex:1;min-width:0"><div class="kname">${m.name}</div><div class="krole">key account manager</div></div>
        <span class="rbadge ${rc}">${m.ratio}%</span>
      </div>
      <div class="mstats">
        <div class="ms t"><div class="ms-v">${m.total}</div><div class="ms-l">total</div></div>
        <div class="ms s"><div class="ms-v">${m.solved}</div><div class="ms-l">solved</div></div>
        <div class="ms p"><div class="ms-v">${m.pending}</div><div class="ms-l">pending</div></div>
        <div class="ms i"><div class="ms-v">${m.ir_count}</div><div class="ms-l">IR mails</div></div>
      </div>
      <div class="rb-bg"><div class="rb ${bc}" style="width:${m.ratio}%"></div></div>
      <div class="clbl">Top categories</div>
      <div class="tcats">${tc||'<span style="font-size:11px;color:#bbb">no data</span>'}</div>${ua}</div>`;
  });
  document.getElementById('cards').innerHTML=h;
}

function rCat(data){
  const lb=data.map(([c])=>c),vl=data.map(([,n])=>n);
  document.getElementById('cleg').innerHTML=lb.map((l,i)=>`<span class="li"><span class="ld" style="background:${CLR[i%CLR.length]};box-shadow:0 0 5px ${CLR[i%CLR.length]}"></span>${l}</span>`).join('');
  if(CC)CC.destroy();
  CC=new Chart(document.getElementById('cChart'),{type:'bar',
    data:{labels:lb,datasets:[{data:vl,backgroundColor:CLR.slice(0,lb.length).map(c=>c+'33'),borderColor:CLR.slice(0,lb.length),borderWidth:2,borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#dde1f0',borderWidth:1,titleColor:'#1a1a2e',bodyColor:'#7a80a0'}},
      scales:{x:{grid:{display:false},ticks:{maxRotation:30}},y:{grid:{color:'#f0f2f8'},ticks:{stepSize:1}}}}});
}

function setDR(n){DR=n;['t7','t30'].forEach(i=>document.getElementById(i).className='tg');document.getElementById(n===7?'t7':'t30').className='tg on';document.getElementById('dlbl').textContent=n;rDay();}
function setDV(v){DV=v;['tda','tdp'].forEach(i=>document.getElementById(i).className='tg');document.getElementById(v==='all'?'tda':'tdp').className='tg on';rDay();}
function rDay(){
  if(!DD.length)return;
  const sl=DD.slice(DD.length-DR);
  document.getElementById('tbadge').textContent='Today: '+(DD[DD.length-1]?.total||0);
  let ds=[];
  if(DV==='all'){
    ds=[{label:'All',data:sl.map(d=>d.total),borderColor:'#0066ff',backgroundColor:'#0066ff14',fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:'#0066ff',borderWidth:2.5,pointBorderColor:'#fff',pointBorderWidth:2}];
    document.getElementById('dleg').innerHTML=`<span class="li"><span class="ld" style="background:#0066ff;box-shadow:0 0 6px #0066ff"></span>all members</span>`;
  } else {
    ds=AK.map((k,i)=>({label:MN[k]||k,data:sl.map(d=>d.per_member[k]||0),borderColor:MC[k]||CLR[i],backgroundColor:(MC[k]||CLR[i])+'14',fill:false,tension:0.4,pointRadius:4,pointBackgroundColor:MC[k]||CLR[i],borderWidth:2.5,pointBorderColor:'#fff',pointBorderWidth:2}));
    document.getElementById('dleg').innerHTML=AK.map(k=>`<span class="li"><span class="ld" style="background:${MC[k]};box-shadow:0 0 6px ${MC[k]}"></span>${MN[k]||k}</span>`).join('');
  }
  if(DC)DC.destroy();
  DC=new Chart(document.getElementById('dChart'),{type:'line',data:{labels:sl.map(d=>fd(d.date)),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#dde1f0',borderWidth:1,titleColor:'#1a1a2e',bodyColor:'#7a80a0'}},
      scales:{x:{grid:{display:false},ticks:{maxRotation:40,autoSkip:true,maxTicksLimit:15}},
              y:{grid:{color:'#f0f2f8'},ticks:{stepSize:1},beginAtZero:true}}}});
}

function setMV(v){MV=v;['tma','tmp'].forEach(i=>document.getElementById(i).className='tg');document.getElementById(v==='all'?'tma':'tmp').className='tg on';rMon();}
function rMon(){
  if(!MD.length)return;
  let ds=[];
  if(MV==='all'){
    ds=[{data:MD.map(d=>d.total),backgroundColor:'#0066ff22',borderColor:'#0066ff',borderWidth:2,borderRadius:6}];
    document.getElementById('mleg').innerHTML=`<span class="li"><span class="ld" style="background:#0066ff;box-shadow:0 0 6px #0066ff"></span>all members</span>`;
  } else {
    ds=AK.map((k,i)=>({label:MN[k]||k,data:MD.map(d=>d[k]||0),backgroundColor:(MC[k]||CLR[i])+'22',borderColor:MC[k]||CLR[i],borderWidth:2,borderRadius:6}));
    document.getElementById('mleg').innerHTML=AK.map(k=>`<span class="li"><span class="ld" style="background:${MC[k]};box-shadow:0 0 6px ${MC[k]}"></span>${MN[k]||k}</span>`).join('');
  }
  if(MC2)MC2.destroy();
  MC2=new Chart(document.getElementById('mChart'),{type:'bar',data:{labels:MD.map(d=>fm(d.month)),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#dde1f0',borderWidth:1,titleColor:'#1a1a2e',bodyColor:'#7a80a0'}},
      scales:{x:{grid:{display:false}},y:{grid:{color:'#f0f2f8'},ticks:{stepSize:1},beginAtZero:true}}}});
}

function rFbM(fb){
  const t=fb.total||0,p=fb.pending||0,s=fb.solved||0,r=fb.ratio||0;
  const rc=r>=80?'var(--ng)':r>=50?'var(--ny)':'var(--np)';
  document.getElementById('fbrow').innerHTML=`
    <div class="mc npu"><div class="mc-lbl">✉ Total Raised</div><div class="mc-val" style="color:var(--npu)">${t}</div></div>
    <div class="mc ny"><div class="mc-lbl">⏳ Pending</div><div class="mc-val" style="color:var(--ny)">${p}</div></div>
    <div class="mc ng"><div class="mc-lbl">✅ Solved</div><div class="mc-val" style="color:var(--ng)">${s}</div></div>
    <div class="mc nc"><div class="mc-lbl">📊 Solve Ratio</div><div class="mc-val" style="color:${rc}">${r}%</div></div>`;
}

function rFbPM(pm){
  let h='';
  Object.entries(pm).forEach(([k,s])=>{
    const col=MC[k]||'#888';const av=AV[k]||'v';const ini=k==='asif'?'AA':'NN';
    const rat=s.total>0?Math.round(s.solved/s.total*100):0;
    const bc=rat>=80?'rbcg':rat>=50?'rbcm':'rbcb';
    h+=`<div class="fbcard">
      <div class="fbname"><div class="av ${av}" style="width:32px;height:32px;font-size:11px">${ini}</div><span style="color:${col};font-weight:700">${MN[k]||k}</span></div>
      <div class="fbstats">
        <div class="fbst fbt"><div class="fbst-v">${s.total}</div><div class="fbst-l">raised</div></div>
        <div class="fbst fbp"><div class="fbst-v">${s.pending}</div><div class="fbst-l">pending</div></div>
        <div class="fbst fbs"><div class="fbst-v">${s.solved}</div><div class="fbst-l">solved</div></div>
      </div>
      <div style="font-size:10px;color:var(--tdim);margin-top:10px;font-family:'Space Mono',monospace">solve ratio: ${rat}%</div>
      <div class="rb-bg"><div class="rb ${bc}" style="width:${rat}%"></div></div>
    </div>`;
  });
  document.getElementById('fbpm').innerHTML=h||'<p style="color:var(--tdim);font-size:12px;font-family:Space Mono,monospace">no feedback data yet.</p>';
}

function rFbT(){
  const q=document.getElementById('fbs').value.toLowerCase();
  const st=document.getElementById('fbst').value;
  const mb=document.getElementById('fbm').value;
  const rows=FB.filter(r=>{
    if(st==='pending'&&!r.pending)return false;
    if(st==='solved'&&!r.solved)return false;
    if(mb!=='all'&&r.key!==mb)return false;
    if(q&&!r.subject.toLowerCase().includes(q))return false;
    return true;
  });
  if(!rows.length){document.getElementById('fbtbl').innerHTML='<p style="color:var(--tdim);text-align:center;padding:24px;font-family:Space Mono,monospace">no mails match.</p>';return;}
  let h=`<table><thead><tr><th>#</th><th>Date</th><th>KAM</th><th>Mail Subject</th><th>Status</th><th>Solved Date</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const col=MC[r.key]||'#888';const ini=r.key==='asif'?'AA':r.key==='nahid'?'NN':'?';
    const sp=r.solved?`<span class="pill psv">✅ solved</span>`:r.pending?`<span class="pill ppd">⏳ pending</span>`:`<span class="pill po">—</span>`;
    h+=`<tr>
      <td style="color:var(--tdim);font-family:'Space Mono',monospace">${i+1}</td>
      <td style="font-family:'Space Mono',monospace;font-size:11px">${r.date||'—'}</td>
      <td><span style="background:${col}18;color:${col};font-size:10px;padding:2px 8px;border-radius:4px;font-family:'Space Mono',monospace;font-weight:700;border:1.5px solid ${col}55">${ini}</span></td>
      <td>${r.subject}</td><td>${sp}</td>
      <td style="font-family:'Space Mono',monospace;font-size:11px">${r.solve_date||'—'}</td>
    </tr>`;
  });
  h+=`</tbody></table><div class="tc">${rows.length} mail${rows.length!==1?'s':''} shown</div>`;
  document.getElementById('fbtbl').innerHTML=h;
}

function rFilt(dates,cats){
  const df=document.getElementById('df'),cf=document.getElementById('cf');
  df.innerHTML='<option value="">All dates</option>';cf.innerHTML='<option value="">All categories</option>';
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;df.appendChild(o);});
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cf.appendChild(o);});
}

function rIss(){
  const q=document.getElementById('sq').value.toLowerCase();
  const df=document.getElementById('df').value,cf=document.getElementById('cf').value;
  const rows=ALL.filter(r=>{
    if(TAB==='asif'&&r.key!=='asif')return false;
    if(TAB==='nahid'&&r.key!=='nahid')return false;
    if(TAB==='ir'&&!r.is_ir)return false;
    if(df&&!r.date.startsWith(df))return false;
    if(cf&&r.cat!==cf)return false;
    if(q){const h=(r.cons+r.comment+r.cat+r.kam).toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  if(!rows.length){document.getElementById('itbl').innerHTML='<p style="color:var(--tdim);text-align:center;padding:24px;font-family:Space Mono,monospace">no issues match.</p>';return;}
  let h=`<table><thead><tr><th>#</th><th>Date</th><th>Who</th><th>Consignment</th><th>Category</th><th>Priority</th><th>Status</th><th>Comment</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const col=MC[r.key]||'#888';
    const sp=r.solved?`<span class="pill ps">${r.status||'solved'}</span>`:`<span class="pill po">${r.status||'—'}</span>`;
    const pp=r.pri.toLowerCase()==='urgent'?`<span class="pill pu">${r.pri}</span>`:r.pri?`<span class="pill po">${r.pri}</span>`:'—';
    const sc=r.comment.length>90?r.comment.substring(0,90)+'…':r.comment;
    h+=`<tr>
      <td style="color:var(--tdim);font-family:'Space Mono',monospace">${i+1}</td>
      <td style="font-family:'Space Mono',monospace;font-size:11px">${r.date||'—'}</td>
      <td><span style="background:${col}18;color:${col};font-size:10px;padding:2px 8px;border-radius:4px;font-family:'Space Mono',monospace;font-weight:700;border:1.5px solid ${col}55">${r.key==='asif'?'AA':'NN'}</span></td>
      <td>${r.cons||'—'}</td>
      <td>${r.cat||'—'}<br><span style="color:var(--tdim);font-size:10px">${r.subcat||''}</span></td>
      <td>${pp}</td><td>${sp}</td>
      <td>${r.is_ir?'<span class="pill pir">✉ IR</span><br>':''}<span style="color:var(--tdim)">${sc||'—'}</span></td>
    </tr>`;
  });
  h+=`</tbody></table><div class="tc">${rows.length} issue${rows.length!==1?'s':''} shown</div>`;
  document.getElementById('itbl').innerHTML=h;
}

function fd(iso){if(!iso)return '';const[,m,d]=iso.split('-');return`${d}/${m}`;}
function fm(ym){if(!ym)return '';const[y,m]=ym.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]+' '+y;}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  this.classList.add('on');TAB=this.dataset.t;rIss();
}));
['sq','df','cf'].forEach(id=>{
  document.getElementById(id).addEventListener('input',rIss);
  document.getElementById(id).addEventListener('change',rIss);
});
['fbs','fbst','fbm'].forEach(id=>{
  document.getElementById(id).addEventListener('input',rFbT);
  document.getElementById(id).addEventListener('change',rFbT);
});

load();setInterval(load,90000);
</script>
</body>
</html>
